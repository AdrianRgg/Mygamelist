@if (isLoggedIn) {
  <nav class="bg-gray-900 border-b border-gray-800 px-4 h-14 flex items-center gap-3 relative">

    <!-- Logo -->
    <a routerLink="/games" (click)="closeMenu()" class="text-white font-bold text-lg mr-auto">
      🎮 <span class="hidden sm:inline">GameTracker</span>
    </a>

    <!-- Desktop links -->
    <div class="hidden md:flex gap-4 items-center">
      <a routerLink="/games" routerLinkActive="text-violet-400"
         class="text-gray-400 hover:text-white text-sm transition-colors">Buscar</a>
      <a routerLink="/my-list" routerLinkActive="text-violet-400"
         class="text-gray-400 hover:text-white text-sm transition-colors">Mi perfil</a>
      <button (click)="goRandom()"
         class="text-sm px-3 py-1 rounded-lg border border-gray-700 text-gray-400 transition-all duration-300 hover:border-violet-500 hover:text-violet-400 hover:bg-violet-500/10">
        🎲 Aleatorio
      </button>
    </div>

    <!-- Desktop search + notifications -->
    <div class="hidden md:flex items-center gap-3">
      <app-user-search />
      <app-notifications />
      <span class="text-gray-400 text-sm hidden lg:inline">{{ userName }}</span>
      <button (click)="logout()"
        class="text-sm border border-gray-700 text-gray-400 hover:bg-red-600 hover:text-white hover:border-red-600 px-3 py-1 rounded-lg transition-colors">
        Salir
      </button>
    </div>

    <!-- Mobile: notifications + hamburger -->
    <div class="flex md:hidden items-center gap-2">
      <app-notifications />
      <button (click)="toggleMenu()"
        class="text-gray-400 hover:text-white p-1.5 rounded-lg border border-gray-700 transition-colors">
        @if (menuOpen) { ✕ } @else { ☰ }
      </button>
    </div>

    <!-- Mobile menu dropdown -->
    @if (menuOpen) {
      <div class="absolute top-14 left-0 right-0 bg-gray-900 border-b border-gray-800 z-50 px-4 py-3 flex flex-col gap-3 md:hidden shadow-xl">

        <app-user-search />

        <div class="border-t border-gray-800 pt-3 flex flex-col gap-2">
          <a routerLink="/games" routerLinkActive="text-violet-400"
             (click)="closeMenu()"
             class="text-gray-300 hover:text-white text-sm py-2 px-3 rounded-lg hover:bg-gray-800 transition-colors">
            🔍 Buscar usuarios
          </a>
          <a routerLink="/my-list" routerLinkActive="text-violet-400"
             (click)="closeMenu()"
             class="text-gray-300 hover:text-white text-sm py-2 px-3 rounded-lg hover:bg-gray-800 transition-colors">
            👤 Mi perfil
          </a>
          <button (click)="goRandom()"
             class="text-gray-300 hover:text-white text-sm py-2 px-3 rounded-lg hover:bg-gray-800 transition-colors text-left">
            🎲 Juego aleatorio
          </button>
        </div>

        <div class="border-t border-gray-800 pt-3 flex items-center justify-between">
          <span class="text-gray-400 text-sm">{{ userName }}</span>
          <button (click)="logout()"
            class="text-sm bg-red-700 hover:bg-red-600 text-white px-4 py-1.5 rounded-lg transition-colors">
            Salir
          </button>
        </div>
      </div>
    }
  </nav>

  <!-- Barra de búsqueda de juegos visible en móvil -->
  <div class="md:hidden px-4 py-2 bg-gray-900 border-b border-gray-800">
    <a routerLink="/games"
       class="flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-gray-500 text-sm">
      🔍 <span>Buscar juegos...</span>
    </a>
  </div>
}
